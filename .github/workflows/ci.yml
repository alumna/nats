name: Crystal CI

on:
  pull_request:
    branches:
      - master

  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NATS_URL: nats://127.0.0.1:4222

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Force apt update
        run: sudo -n apt-get update

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest
      - run: crystal tool format --check

  test:
    runs-on: ubuntu-latest
    services:
      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
        command: nats-server -js -m 8222 -sd /tmp
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8222/healthz || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Force apt update
        run: sudo -n apt-get update

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest
      - uses: actions/cache@v6
        with:
          path: |
            lib
            ~/.cache/shards
            %USERPROFILE%\.cache\shards
          key: ${{ runner.os }}-crystal-latest-shards-${{ hashFiles('shard.yml') }}
          restore-keys: |
            ${{ runner.os }}-crystal-latest-shards-
      - run: shards install
      - name: Run specs (Single-Threaded)
        run: crystal spec --error-trace --verbose
      - name: Run specs (Multi-Threaded)
        run: crystal spec -Dpreview_mt -Dexecution_context --error-trace --verbose

  coverage:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: write
    services:
      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
        command: nats-server -js -m 8222 -sd /tmp
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8222/healthz || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Force apt update
        run: sudo -n apt-get update

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Install kcov
        run: |
          sudo apt-get update
          sudo apt-get install -y kcov

      - uses: actions/cache@v6
        with:
          path: |
            lib
            ~/.cache/shards
          key: ubuntu-22.04-crystal-latest-shards-${{ hashFiles('shard.yml') }}

      - run: shards install

      - name: Build specs binary
        run: |
          echo 'require "./spec/**"' > all_specs.cr
          mkdir -p bin coverage
          crystal build all_specs.cr -o bin/all_specs --debug

      - name: Run kcov (src coverage)
        run: |
          kcov --clean --include-path=$(pwd)/src ./coverage ./bin/all_specs

      - name: Require 100 percent src line coverage
        run: |
          set -euo pipefail
          xml=$(find coverage -name cobertura.xml | sort | tail -1)
          grep 'line-rate="1.000"' "$xml" | head -1

      - name: Generate unreachable report
        run: |
          crystal tool unreachable --format=codecov --no-color --exclude spec all_specs.cr > ./coverage/unreachable.codecov.json

      - name: Generate macro coverage
        run: |
          crystal tool macro_code_coverage --format=codecov --no-color all_specs.cr > ./coverage/macro_coverage.root.codecov.json

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: alumna/nats
          files: ./coverage/**/cobertura.xml,./coverage/**/cov.xml,./coverage/unreachable.codecov.json,./coverage/macro_coverage.*.codecov.json
          flags: unittests
          fail_ci_if_error: true
          verbose: true

      - name: Run specs and generate JUnit XML for Test Analytics
        run: |
          mkdir -p junit
          crystal spec --junit_output ./junit --error-trace

      - name: Upload test results to Codecov (Test Analytics)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: alumna/nats
          report_type: test_results
          files: ./junit/output.xml
          flags: unittests
          fail_ci_if_error: false
          verbose: true
